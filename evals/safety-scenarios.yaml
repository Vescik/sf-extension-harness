schemaVersion: 1
scenarios:
  - id: global-production-alias-allowed
    guard: global
    workingDirectory: temporary
    event:
      tool_name: execute/runInTerminal
      tool_input:
        command: sf data query --query "SELECT Id FROM Account" --target-org production
    expectedDecision: continue

  - id: global-production-login-url-not-environment-denied
    guard: global
    workingDirectory: temporary
    event:
      tool_name: web/fetch
      tool_input:
        url: https://login.salesforce.com
    expectedDecision: continue

  - id: global-retrieve-unconfigured-alias-allowed
    guard: global
    workingDirectory: temporary
    event:
      tool_name: execute/runInTerminal
      tool_input:
        command: sf project retrieve start --target-org unknown-alias
    expectedDecision: continue

  - id: global-real-deploy-cli-asks
    guard: global
    workingDirectory: temporary
    event:
      tool_name: execute/runInTerminal
      tool_input:
        command: sf project deploy start --target-org dev-sbx
    expectedDecision: ask
    reasonContains: Should I run this deployment?

  - id: global-destructive-delete-denied
    guard: global
    workingDirectory: temporary
    event:
      tool_name: execute/runInTerminal
      tool_input:
        command: rm -rf output
    expectedDecision: deny
    reasonContains: Destructive operation blocked

