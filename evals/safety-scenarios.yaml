  - id: search-wiki-without-project-denied
    guard: global
    workingDirectory: repository
    event:
      tool_name: ado-readonly/search_wiki
      tool_input:
        searchText: revenue adjustment
    expectedDecision: deny
    # Missing local config and missing project scope proof share this prefix, so the assertion
    # holds with or without a developer's config/harness.local.json present.
    reasonContains: "ADO read blocked"

  - id: ado-call-without-runtime-policy-denied
    guard: global
    workingDirectory: repository
    event:
      tool_name: ado-readonly/wit_work_item
      tool_input:
        project: Other Project
        id: 1201
    expectedDecision: deny
    # Both branches of the ADO guard (missing local config, or org/project mismatch when a
    # local config is present) share this prefix, so the assertion holds whether or not the
    # developer has a config/harness.local.json checked out.
    reasonContains: "ADO read blocked"

  - id: global-composed-soql-extra-args-denied
    guard: global
    workingDirectory: temporary
    event:
      tool_name: salesforce/review_soql_query
      tool_input:
        query: SELECT Id FROM Account
        usernameOrAlias: other
    expectedDecision: deny
    # Both branches of the review-tool guard (missing local config in CI, or the extra-args
    # shape rejection when a config/harness.local.json is present) share this prefix, so the
    # assertion holds in every environment. The allow path needs a configured review org and
    # is therefore pinned with an inline config in tests/test_safety_hooks.py instead.
    reasonContains: "Salesforce org review blocked"

