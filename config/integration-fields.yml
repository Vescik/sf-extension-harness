# Integration field registry — the single authority mapping integration-sensitive
# Salesforce fields to the integrations that consume them.
#
# Ownership and update timing:
# - The integration/platform owner named in each entry maintains that entry; review the
#   whole registry quarterly (human process) and whenever an integration contract changes.
# - Populate entries only from confirmed integration contracts — never from guesses.
#   The bootstrap state below (integrations: {}) is intentional for a freshly copied
#   workspace: the checker reports REGISTRY_EMPTY and does not claim "no impact".
# - Fields are canonical, case-preserving `ObjectApiName.FieldApiName` strings
#   (e.g. Account.External_Id__c). One field may appear under several integrations;
#   duplicates within one integration are invalid.
# - No credentials, endpoints, tokens, payloads, customer data, or org IDs belong here.
#
# MOCK DATA (2026-08-12): the entries below are placeholder/sample integrations added on
# owner request to exercise the populated-registry path. They do NOT describe real
# integration contracts — replace them with confirmed entries (or empty the map back to
# `integrations: {}`) before relying on integration-impact coverage. While mock entries
# are present the checker reports NO_REGISTERED_IMPACT / IMPACT_DETECTED against THIS
# mock data, not against reality.

version: 1

integrations:
  erp-customer-sync:
    name: ERP Customer Sync (mock)
    owner: integration-team
    fields:
      - Account.External_Id__c
      - Account.ERP_Account_Number__c
      - Contact.Customer_Number__c

